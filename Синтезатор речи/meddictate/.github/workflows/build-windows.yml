name: Сборка MedDictate.exe

# Собирает портативный exe в облаке: Python на вашем компьютере не нужен.
#
# Как получить файл:
#   1. загрузите этот проект в свой репозиторий на GitHub;
#   2. откройте вкладку Actions -> "Сборка MedDictate.exe" -> Run workflow;
#   3. дождитесь окончания (~5 минут) и скачайте артефакт
#      MedDictate-windows-x64 (внутри один файл MedDictate.exe).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Кэш русской модели Vosk
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачать модель, если нет в кэше
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python tools/fetch_model.py

      - name: Самопроверка корректора
        run: python meddictate.py --selftest

      - name: Тесты
        run: python -m pytest tests -q

      - name: Проверка отчёта по словарю
        run: python meddictate.py --model-check

      - name: Сборка exe
        run: python -m PyInstaller --noconfirm --clean meddictate.spec

      - name: Проверить, что exe создан
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MedDictate.exe")) { throw "MedDictate.exe не собран" }
          $size = (Get-Item "dist/MedDictate.exe").Length / 1MB
          Write-Host ("Размер: {0:N1} МБ" -f $size)

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MedDictate-windows-x64
          path: dist/MedDictate.exe
          if-no-files-found: error

      - name: Приложить к релизу (если это тег)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MedDictate.exe
          generate_release_notes: true
